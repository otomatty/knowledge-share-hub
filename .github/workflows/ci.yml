name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege: this workflow only reads the repo. Avoid inheriting
# broader org/repo defaults for GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to commit SHAs (supply-chain
      # hardening). Update the SHA + comment together when bumping.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pin to a major.minor band so lockfile resolution stays
          # reproducible across runs.
          bun-version: 1.x
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Build
        run: bun run build
